<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>핏센스 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div class="stage">
  <aside class="side" aria-label="프로토타입 컨트롤">
    <h1>핏센스 프로토타입</h1>
    <p>와이어프레임 v3 · 오른쪽 폰 화면에서 직접 눌러볼 수 있어요. 아래 버튼으로 원하는 화면에 바로 이동해요.</p>
    <h3>홈 · 튜토리얼</h3>
    <div class="jump"><button data-jump="home">홈</button><button data-jump="homeNoBody">홈 (신체 미입력)</button><button data-jump="tutorial">튜토리얼</button></div>
    <h3>사이즈 측정</h3>
    <div class="jump"><button data-jump="measure1">① 바디 프로필</button><button data-jump="measure1empty">① 처음 입력</button><button data-jump="measure2">② 옷 입력</button><button data-jump="measure2f">② 상품 불러온 상태</button><button data-jump="analyzing">분석 중</button><button data-jump="result">결과</button><button data-jump="saved">저장 완료</button></div>
    <h3>브랜드</h3>
    <div class="jump"><button data-jump="brand">브랜드</button><button data-jump="brandCat">카테고리 선택</button><button data-jump="brandDetail">브랜드 상세</button><button data-jump="product">상품 정보</button><button data-jump="chart">사이즈표</button><button data-jump="reviews">사이즈 후기</button><button data-jump="review">후기 상세</button></div>
    <h3>기록 · 찜 · 마이</h3>
    <div class="jump"><button data-jump="records">분석 기록</button><button data-jump="record">기록 상세·피드백</button><button data-jump="closet">마이핏드백</button><button data-jump="closetAdd">옷 추가</button><button data-jump="likes">찜</button><button data-jump="my">마이</button><button data-jump="myfit">마이핏</button></div>
    <h3>도구</h3>
    <div class="jump"><button data-a="resetAll">처음 상태로 초기화</button></div>
    <div class="note"><b>데이터</b>zip의 JSON(브랜드 9 · 상품 73 · 후기 300)을 그대로 사용해요. 대부분 더미 데이터예요.</div>
    <div class="note"><b>AI 분석</b>사진은 읽지 않고 샘플 실측으로 대체해요. 이후 판정·추천은 기존 fit_model 규칙으로 계산돼요.</div>
  </aside>
  <div class="phone" id="phone">
    <main class="view" id="view"></main>
    <nav class="nav" id="nav" aria-label="하단 메뉴">
      <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button data-tab="brand"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>브랜드</button>
      <button data-tab="records"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>기록</button>
      <button data-tab="likes"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9.2C1.8 7 4 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3 0 5.2 3 4 6.8C19 15.4 12 20 12 20z"/></svg>찜</button>
      <button data-tab="my"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>마이</button>
    </nav>
  </div>
</div>
<script src="js/data.js"></script>
<script>
// data.js 가 JSON 을 읽어 DB 를 만든 뒤에 app.js 를 불러온다
fetchRaw().then(function (raw) {
  window.DB = mapDB(raw);
  var s = document.createElement('script'); s.src = 'js/app.js';
  s.onerror = function () { document.getElementById('view').textContent = 'js/app.js 로드 실패'; };
  document.body.appendChild(s);
}).catch(function (e) {
  document.getElementById('view').innerHTML = '<div class="empty">데이터를 불러오지 못했어요.<br>GitHub Pages 주소나 <code>python -m http.server 8000</code> 로 열어주세요.<br><span class="xs">' + e.message + '</span></div>';
});
</script>

</body>
</html>
