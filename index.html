<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>핏센스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <header class="appbar" id="appbar"><button class="brandmark" data-a="goHome" aria-label="핏센스 홈"><span class="logo">FS</span><b>핏센스</b></button><span class="abr"><button class="ib heart" id="ab-likes" data-a="goLikes" aria-label="찜"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9.2C1.8 7 4 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 3 0 5.2 3 4 6.8C19 15.4 12 20 12 20z"/></svg></button><button class="ib" id="ab-notif" data-a="goNotifs" aria-label="알림"><svg viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg><i class="ndot" id="nfdot" hidden></i></button></span></header>
    <main class="view" id="view"></main>
    <nav class="nav" id="nav" aria-label="하단 메뉴">
      <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button data-tab="brand"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>브랜드</button>
      <button data-tab="measure" class="mbtn" aria-label="사이즈 측정"><span class="mc"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg></span>측정</button>
      <button data-tab="records"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>기록</button>
      <button data-tab="my"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>마이</button>
    </nav>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/check.js"></script>
<script>
(async () => {
  try {
    const raw = await fetchRaw();
    checkData(raw);
    window.DB = mapDB(raw);
    for (const f of ["js/core.js", "js/home_measure.js", "js/browse.js", "js/records_my.js"]) await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = f; s.onload = ok; s.onerror = () => ko(new Error(f + ' 로드 실패')); document.body.appendChild(s); });
  } catch (e) {
    console.error(e);
    document.getElementById('view').innerHTML = '<div class="pad" style="text-align:center;padding-top:96px"><h1 class="big">데이터를 불러오지 못했어요</h1><p class="sm mute" style="margin-top:8px">GitHub Pages 주소로 열거나, 로컬에서는 <code>python -m http.server 8000</code> 으로 실행해 주세요.<br>(index.html을 더블클릭하면 브라우저가 JSON 읽기를 막아요)</p></div>';
  }
})();
</script>

</body>
</html>
